<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 7.9 — EMA Eviction Policy</title>
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: linear-gradient(135deg, var(--bg-primary), var(--bg-card)); min-height: 100vh; color: var(--text-primary); }
.ev-row { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.75rem 0 0; }
.ev { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.02em; border: 1px solid; background: var(--bg-code); }
.ev-meas { color: var(--accent-green); border-color: rgba(63,185,80,0.45); }
.ev-sim { color: var(--accent-orange); border-color: rgba(210,153,34,0.45); }
.ev-model { color: var(--accent-cyan); border-color: rgba(88,166,255,0.45); }
.ev-lit { color: var(--accent-purple); border-color: rgba(163,113,247,0.45); }
.ev-ill { color: var(--text-secondary); border-color: var(--border-primary); }
.alpha-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.6rem; }
.alpha-table th, .alpha-table td { padding: 0.5rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border-secondary); }
.alpha-table th { color: var(--text-secondary); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.alpha-table td { font-family: var(--font-mono); color: var(--text-primary); }
.alpha-table td:first-child { font-family: var(--font-sans); color: var(--text-secondary); }
.alpha-table tr.opt td { color: var(--accent-green); font-weight: 600; }
.table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<div id="root" role="main"></div>
<script type="text/babel">
const { useState, useEffect } = React;
function EMAEviction() {
  const [step, setStep] = useState(0);
  const [scores, setScores] = useState([0.8, 0.3, 0.6, 0.1, 0.5, 0.2, 0.9, 0.4]);
  /* alpha = 0.2 was never validated and is withdrawn. The simulated optimum is
     alpha ~ 0.05 (55.96% at a 32 GiB budget against LRU's 36.85%, +19.1 pts).
     Simulation Revision 2 — provisional, not settled. */
  const alpha = 0.05;
  const halfLife = (Math.log(0.5) / Math.log(1 - alpha)).toFixed(1);   // 13.5 decode steps

  useEffect(() => {
    if (step > 0 && step <= 5) {
      const timer = setTimeout(() => {
        setScores(s => s.map((v, i) => {
          const attn = Math.random() * 0.5;
          return alpha * attn + (1 - alpha) * v;
        }));
      }, 100);
      return () => clearTimeout(timer);
    }
  }, [step]);

  const styles = {
    container: { maxWidth: '860px', margin: '0 auto', padding: '2rem' },
    header: { textAlign: 'center', marginBottom: '1.75rem' },
    badge: { display: 'inline-block', padding: '0.25rem 0.75rem', background: 'rgba(240,194,57,0.15)', color: 'var(--accent-yellow)', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', borderRadius: '20px', marginBottom: '0.5rem' },
    formula: { background: 'var(--bg-primary)', borderRadius: '12px', padding: '1rem', textAlign: 'center', marginBottom: '2rem', fontFamily: 'var(--font-mono)', color: 'var(--accent-cyan)' },
    grid: { display: 'grid', gridTemplateColumns: 'repeat(8, 1fr)', gap: '0.5rem', marginBottom: '2rem' },
    token: (score) => ({ background: 'var(--bg-card)', borderRadius: '8px', padding: '1rem', textAlign: 'center', border: `2px solid ${score < 0.25 ? 'var(--accent-red)' : score > 0.6 ? 'var(--accent-green)' : 'var(--border-primary)'}` }),
    bar: (score) => ({ height: 60, background: 'var(--bg-primary)', borderRadius: '4px', overflow: 'hidden', position: 'relative' }),
    fill: (score) => ({ position: 'absolute', bottom: 0, width: '100%', height: `${score * 100}%`, background: score < 0.25 ? 'var(--accent-red)' : score > 0.6 ? 'var(--accent-green)' : 'var(--accent-orange)', transition: 'all 0.3s' }),
    btns: { display: 'flex', justifyContent: 'center', gap: '1rem', marginBottom: '1rem' },
    btn: { padding: '0.5rem 1rem', background: 'var(--accent-cyan)', color: 'var(--bg-primary)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 600 },
    card: { background: 'var(--bg-card)', border: '1px solid var(--border-primary)', borderRadius: '14px', padding: '1.25rem 1.35rem', marginTop: '1.5rem' },
    cardOrange: { background: 'var(--bg-card)', border: '1px solid var(--border-primary)', borderLeft: '4px solid var(--accent-orange)', borderRadius: '0 14px 14px 0', padding: '1.25rem 1.35rem', marginTop: '1.5rem' },
    cardPurple: { background: 'var(--bg-card)', border: '1px solid var(--border-primary)', borderLeft: '4px solid var(--accent-purple)', borderRadius: '0 14px 14px 0', padding: '1.25rem 1.35rem', marginTop: '1.5rem' },
    titleOrange: { color: 'var(--accent-orange)', fontWeight: 600, fontSize: '0.98rem', marginBottom: '0.55rem' },
    titlePurple: { color: 'var(--accent-purple)', fontWeight: 600, fontSize: '0.98rem', marginBottom: '0.55rem' },
    body: { color: 'var(--text-secondary)', fontSize: '0.86rem', lineHeight: 1.75 },
    light: { color: 'var(--text-primary)' }
  };

  return (
    <div style={styles.container}>
      <p className="sr-only">Figure: EMA-based eviction of KV-cache entries. Each token's attention score is smoothed with
      score_t = alpha times attention_t plus one minus alpha times score_t-1. The animation now runs at alpha = 0.05,
      which is the simulated optimum, giving a half-life of ln 0.5 over ln 0.95 = 13.5 decode steps. The previously
      published alpha = 0.2 was never validated and is withdrawn. In the corrected simulation, Revision 2, alpha is
      non-monotonic with an interior optimum: at a 32 gibibyte budget the hit rate is 37.20 percent at alpha 0.5, 38.84
      at 0.3, 44.33 at 0.15, 55.96 at 0.05, 31.54 at 0.01, 25.47 at 0.003 and 24.44 at 0.001, against LFU at 15.56 and
      LRU at 36.85. Alpha of about 0.05 is therefore the optimum and is plus 19.1 percentage points over LRU, while at
      the specified alpha the margin over LRU is only plus 2.5 to plus 5.8 points — not the plus 25 points previously
      claimed, and there is no convergence onto LFU as alpha goes to zero. The plus 7 point contribution attributed to
      EMA in isolation, and the 87 percent cumulative hit rate that went with it, are retracted along with the whole 72
      to 80 to 87 to 93 to 97 ladder, for which no ablation was ever run. A decayed-frequency score of this kind is not
      novel: it is LRFU, published by Lee and colleagues at SIGMETRICS in 1999, and alpha is its documented knob between
      LRU and LFU behaviour. Eight tokens T0 to T7 start at scores 0.80, 0.30, 0.60, 0.10, 0.50, 0.20, 0.90 and 0.40;
      stepping forward applies the update above to each. A token scoring above 0.6 is kept, below 0.25 is evicted, and in
      between is warm, so on the opening state T0 at 0.80 and T6 at 0.90 are keeps while T3 at 0.10 and T5 at 0.20 are
      evictions. Those 0.6 and 0.25 cut points are demo thresholds chosen to suit the synthetic score spread of this
      animation, not the design's thresholds; they are uncalibrated illustrative values, as are the design's own keep,
      demote and evict thresholds of 0.10 and 0.02. All simulated values here are provisional rather than settled,
      because a single data-structure defect in Revision 1 of the simulator inverted four of five findings.</p>
      <div style={styles.header}>
        <div style={styles.badge}>FIGURE 7.9</div>
        <h1 style={{fontSize: '1.75rem', fontWeight: 700, marginBottom: '0.5rem'}}>EMA-Based Eviction</h1>
        <p style={{color: 'var(--text-secondary)'}}>Exponential Moving Average smooths attention scores</p>
        <p style={{color: 'var(--text-secondary)', fontSize: '0.85rem', marginTop: '0.35rem'}}>
          α = {alpha} <span style={styles.light}>(simulated optimum)</span> → half-life ln0.5/ln0.95 = {halfLife} decode steps
        </p>
        <div className="ev-row">
          <span className="ev ev-sim">Simulated (provisional)</span>
          <span className="ev ev-ill">Illustrative — synthetic animation</span>
          <span className="ev ev-lit">External literature — LRFU, Lee et al. 1999</span>
        </div>
      </div>
      <div style={styles.formula}>
        score_t = {alpha} × attention_t + {(1 - alpha).toFixed(2)} × score_{'{t-1}'} &nbsp;&nbsp; (α = {alpha}, half-life {halfLife} steps)
      </div>
      <div style={styles.btns}>
        <button style={styles.btn} onClick={() => setStep(s => s + 1)}>Step Forward</button>
        <button style={{...styles.btn, background: 'var(--border-primary)', color: 'var(--text-primary)'}} onClick={() => { setStep(0); setScores([0.8, 0.3, 0.6, 0.1, 0.5, 0.2, 0.9, 0.4]); }}>Reset</button>
      </div>
      <div style={styles.grid}>
        {scores.map((score, i) => (
          <div key={i} role="img" aria-label={`Token T${i}, EMA score ${score.toFixed(2)}, ${score < 0.25 ? 'evict' : score > 0.6 ? 'keep' : 'warm'}`} style={styles.token(score)}>
            <div style={styles.bar(score)} aria-hidden="true"><div style={styles.fill(score)}></div></div>
            <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '0.5rem'}}>T{i}</div>
            <div style={{fontSize: '0.8rem', fontFamily: 'var(--font-mono)', color: score < 0.25 ? 'var(--accent-red)' : 'var(--text-secondary)'}}>{score.toFixed(2)}</div>
          </div>
        ))}
      </div>
      <div style={{display: 'flex', justifyContent: 'center', gap: '2rem', fontSize: '0.875rem'}}>
        <span><span aria-hidden="true" style={{color: 'var(--accent-green)'}}>■</span> Keep (score &gt; 0.6)</span>
        <span><span aria-hidden="true" style={{color: 'var(--accent-orange)'}}>■</span> Warm</span>
        <span><span aria-hidden="true" style={{color: 'var(--accent-red)'}}>■</span> Evict (score &lt; 0.25)</span>
      </div>

      <div style={styles.cardOrange}>
        <div style={styles.titleOrange}>α = 0.2 was never validated — the simulated optimum is α ≈ 0.05</div>
        <div style={styles.body}>
          α is <strong style={styles.light}>non-monotonic with an interior optimum</strong>, and there is no convergence
          onto LFU as α → 0. At a 32 GiB HBM budget:
          <div className="table-scroll">
            <table className="alpha-table">
              <caption className="sr-only">Simulated hit rate against α at a 32 gibibyte HBM budget, Revision 2, provisional.</caption>
              <thead>
                <tr><th scope="col">α</th><th scope="col">Hit rate</th><th scope="col">vs LRU (36.85%)</th></tr>
              </thead>
              <tbody>
                <tr><td>0.5</td><td>37.20%</td><td>+0.4 pts</td></tr>
                <tr><td>0.3</td><td>38.84%</td><td>+2.0 pts</td></tr>
                <tr><td>0.15</td><td>44.33%</td><td>+7.5 pts</td></tr>
                <tr className="opt"><td>0.05 — optimum</td><td>55.96%</td><td>+19.1 pts</td></tr>
                <tr><td>0.01</td><td>31.54%</td><td>−5.3 pts</td></tr>
                <tr><td>0.003</td><td>25.47%</td><td>−11.4 pts</td></tr>
                <tr><td>0.001</td><td>24.44%</td><td>−12.4 pts</td></tr>
                <tr><td>LFU</td><td>15.56%</td><td>−21.3 pts</td></tr>
              </tbody>
            </table>
          </div>
          <div style={{marginTop: '0.8rem'}}>
            <strong style={styles.light}>Retracted:</strong> the claim that EMA in isolation contributes
            <strong style={styles.light}> +7 pts</strong> of hit rate for an <strong style={styles.light}>87% cumulative</strong>
            figure, and the 72 → 80 → 87 → 93 → 97 ladder it belonged to. <strong style={styles.light}>No ablation was
            ever run</strong>; the increments were assumed additive and independent. The real margin over LRU is
            <strong style={styles.light}> +2.5 to +5.8 pts</strong> at the specified α (experiment e1) and
            <strong style={styles.light}> +19.1 pts</strong> at the tuned α ≈ 0.05 (experiment e2) — different
            experiments with different baselines, never to be mixed.
          </div>
        </div>
      </div>

      <div style={styles.cardPurple}>
        <div style={styles.titlePurple}>A decayed-frequency score is LRFU — established prior art</div>
        <div style={styles.body}>
          The scoring function is not the contribution. A decayed-frequency score of exactly this form is
          <strong style={styles.light}> LRFU (Lee et al., SIGMETRICS 1999)</strong>, and
          <strong style={styles.light}> α is its documented LRU↔LFU knob</strong>: large α behaves like recency, small α
          like frequency. What this work claims instead is a protocol result — making KV state and its control metadata a
          single migratable object, with identity-keyed policy state that survives the round trip between tiers. In
          simulation that persistence is worth more than the choice of policy: at 32 GiB it is
          <strong style={styles.light}> +34.15 pts</strong> for LFU and <strong style={styles.light}>+24.85 pts</strong>
          for EMA α = 0.01, against <strong style={styles.light}>−0.21 pts</strong> for EMA α = 0.15.
        </div>
      </div>

      <div className="callout warning" style={{marginTop: '1.5rem'}}>
        <div className="callout-title">The 0.6 / 0.25 cut points here are demo thresholds, not the design's thresholds</div>
        <p style={{marginBottom: '0.5rem'}}>This animation seeds eight tokens with synthetic scores spread
        evenly across 0.1–0.9 so that the keep / warm / evict bands are all visibly populated as you step.
        The 0.6 and 0.25 cut points are chosen to suit that synthetic spread and nothing else — they are
        <strong> uncalibrated illustrative values</strong>.</p>
        <p style={{marginBottom: '0.5rem'}}>They are deliberately not the same numbers as the design's
        keep / demote / evict thresholds of <strong>0.10 / 0.02</strong> (Figure 7.7), and the difference is
        not a contradiction. A real EMA lags its input and saturates far below the raw attention mass, and it does so
        more strongly at α = 0.05 than at the α = 0.2 previously assumed here: a token drawing a steady 4% of attention
        converges to a score near 0.04, not 0.4. Real scores therefore live near the bottom of the 0–1 range, which is
        why the design's thresholds are an order of magnitude lower than the ones used here to make a demo legible.</p>
        <p style={{marginBottom: 0}}>Both sets are uncalibrated and both need tuning against real attention
        traces. See <a href="../../appendix/k-methodology.html">Appendix K §K.7 — Uncalibrated
        parameters</a>.</p>
      </div>

      <div style={{textAlign: 'center', color: 'var(--text-secondary)', fontSize: '0.78rem', marginTop: '1.5rem', paddingTop: '0.75rem', borderTop: '1px solid var(--border-primary)', lineHeight: 1.7}}>
        Illustrative animation with synthetic attention values, not measured data. The α sweep and policy margins are
        <strong style={{color: 'var(--text-primary)'}}> simulated (provisional)</strong> — Revision 2 of
        <span style={{fontFamily: 'var(--font-mono)'}}> kv_tiering_sim_v2.py</span>, 2–3 seeds, no Belady bound, no
        bandwidth or queueing model, no hardware validation. A single data-structure defect in Revision 1 inverted four
        of five findings, which is why Revision 2 is provisional rather than settled.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<EMAEviction />);
</script>
</body>
</html>
