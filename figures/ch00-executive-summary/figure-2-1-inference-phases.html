<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.1 — LLM Inference Phases</title>
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
</style>
</head>
<body>
<div id="root" role="main"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function InferencePhasesVisual() {
  const [step, setStep] = useState(0);
  const [autoPlay, setAutoPlay] = useState(false);
  
  useEffect(() => {
    if (autoPlay && step < 6) {
      const timer = setTimeout(() => setStep(s => s + 1), 1500);
      return () => clearTimeout(timer);
    } else if (step >= 6) {
      setAutoPlay(false);
    }
  }, [autoPlay, step]);

  const promptTokens = ['Explain', 'quantum', 'computing', 'in', 'simple', 'terms'];
  const outputTokens = ['Quantum', 'computing', 'uses', 'qubits', '...'];
  
  const styles = {
    container: { maxWidth: '1000px', margin: '0 auto', padding: '2rem' },
    header: { textAlign: 'center', marginBottom: '2rem' },
    badge: { display: 'inline-block', padding: '0.25rem 0.75rem', background: 'rgba(59,130,246,0.2)', color: 'var(--accent-cyan)', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', borderRadius: '20px', marginBottom: '0.5rem' },
    title: { fontSize: '1.75rem', fontWeight: 700, marginBottom: '0.5rem' },
    subtitle: { color: 'var(--text-secondary)' },
    btnGroup: { display: 'flex', justifyContent: 'center', gap: '1rem', marginBottom: '2rem' },
    btnPlay: { padding: '0.5rem 1rem', background: 'var(--accent-green)', color: 'var(--bg-primary)', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 600 },
    btnReset: { padding: '0.5rem 1rem', background: 'var(--bg-card-hover)', color: 'white', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 600 },
    grid: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1.5rem', marginBottom: '2rem' },
    card: { background: 'var(--bg-card)', borderRadius: '16px', padding: '1.5rem', border: '2px solid var(--border-primary)', transition: 'all 0.3s' },
    cardActive: (color) => ({ borderColor: color, boxShadow: `0 0 30px ${color}33` }),
    cardHeader: { display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem' },
    cardNum: (bg) => ({ width: 36, height: 36, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, color: 'var(--bg-primary)', background: bg }),
    cardTitle: (color) => ({ fontSize: '1.1rem', fontWeight: 600, color }),
    cardSubtitle: { fontSize: '0.8rem', color: 'var(--text-secondary)' },
    tokenBox: { background: 'var(--bg-code)', borderRadius: '12px', padding: '1rem', marginBottom: '1rem' },
    tokenLabel: { fontSize: '0.75rem', color: 'var(--text-secondary)', marginBottom: '0.5rem' },
    tokenGrid: { display: 'flex', flexWrap: 'wrap', gap: '0.5rem' },
    token: (active, color) => ({ padding: '0.375rem 0.75rem', borderRadius: '8px', fontFamily: 'var(--font-mono)', fontSize: '0.875rem', background: active ? color : 'var(--bg-card-hover)', color: active ? 'var(--bg-primary)' : 'var(--text-secondary)', transition: 'all 0.3s' }),
    kvBar: (active) => ({ height: 32, borderRadius: 4, background: active ? 'var(--accent-blue)' : 'var(--bg-card-hover)', transition: 'all 0.3s' }),
    statusMsg: (color) => ({ marginTop: '0.75rem', display: 'flex', alignItems: 'center', gap: '0.5rem', color, fontSize: '0.875rem' }),
    comparisonTable: { background: 'var(--bg-card)', borderRadius: '16px', overflow: 'hidden' },
    tableRow: { display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', borderBottom: '1px solid var(--border-primary)' },
    tableHeader: { padding: '1rem', background: 'var(--bg-code)', fontWeight: 600, textAlign: 'center' },
    tableCell: { padding: '1rem', textAlign: 'center' },
    highlight: (color) => ({ color, fontWeight: 600 })
  };

  return (
    <div style={styles.container}>
      <p className="sr-only">Figure 2.1: the two phases of LLM inference, prefill and decode, shown side by side. Prefill processes all input tokens in parallel — here a 6-token prompt — is compute-bound, and writes the KV-cache once; decode then generates one token per forward pass, is memory-bound, and reads the entire KV-cache at every step. The comparison table below repeats the contrast: parallelism of all N tokens versus 1 token, a bottleneck of compute FLOPs versus memory bandwidth, and a KV-cache that is written once versus read every step. All values are an analytical model, not measured.</p>
      <div style={styles.header}>
        <div style={styles.badge}>FIGURE 2.1</div>
        <h1 style={styles.title}>LLM Inference: Two Phases</h1>
        <p style={styles.subtitle}>Visualizing the fundamental difference between prefill and decode</p>
      </div>

      <div style={styles.btnGroup}>
        <button style={styles.btnPlay} onClick={() => { setStep(0); setAutoPlay(true); }}>▶ Play Animation</button>
        <button style={styles.btnReset} onClick={() => setStep(0)}>↺ Reset</button>
      </div>

      <div style={styles.grid}>
        {/* Prefill Phase */}
        <div style={{...styles.card, ...(step >= 1 && step <= 2 ? styles.cardActive('var(--accent-green)') : {})}}>
          <div style={styles.cardHeader}>
            <div style={styles.cardNum('var(--accent-green)')}>1</div>
            <div>
              <div style={styles.cardTitle('var(--accent-green)')}>Prefill Phase</div>
              <div style={styles.cardSubtitle}>Parallel • Compute-bound</div>
            </div>
          </div>
          <div style={styles.tokenBox}>
            <div style={styles.tokenLabel}>Input Prompt (N=6 tokens)</div>
            <div style={styles.tokenGrid}>
              {promptTokens.map((token, i) => (
                <div key={i} style={styles.token(step >= 1, 'var(--accent-green)')}>{token}</div>
              ))}
            </div>
            {step >= 1 && <div style={styles.statusMsg('var(--accent-green)')}>⚡ Processing ALL tokens in parallel</div>}
          </div>
          <div style={styles.tokenBox}>
            <div style={styles.tokenLabel}>KV-Cache Generation</div>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 4}}>
              {promptTokens.map((_, i) => (
                <div key={i} style={{textAlign: 'center'}}>
                  <div style={styles.kvBar(step >= 2)} role="img" aria-label={`KV-cache entry K${i}, ${step >= 2 ? 'written during prefill' : 'not yet written'}`}></div>
                  <div style={{fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: 4}}>K{i}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Decode Phase */}
        <div style={{...styles.card, ...(step >= 3 ? styles.cardActive('var(--accent-orange)') : {})}}>
          <div style={styles.cardHeader}>
            <div style={styles.cardNum('var(--accent-orange)')}>2</div>
            <div>
              <div style={styles.cardTitle('var(--accent-orange)')}>Decode Phase</div>
              <div style={styles.cardSubtitle}>Sequential • Memory-bound</div>
            </div>
          </div>
          <div style={styles.tokenBox}>
            <div style={styles.tokenLabel}>Output Generation (one at a time)</div>
            <div style={styles.tokenGrid}>
              {outputTokens.map((token, i) => (
                <div key={i} style={styles.token(step >= 3 + i, 'var(--accent-orange)')}>{token}</div>
              ))}
            </div>
            {step >= 3 && <div style={styles.statusMsg('var(--accent-orange)')}>🔄 One token per forward pass</div>}
          </div>
          <div style={styles.tokenBox}>
            <div style={styles.tokenLabel}>KV-Cache Access Pattern</div>
            <div style={{fontSize: '0.875rem', color: 'var(--text-secondary)'}}>
              Each decode step reads <span style={{color: 'var(--accent-orange)', fontWeight: 600}}>entire cache</span> to compute attention
            </div>
          </div>
        </div>
      </div>

      {/* Comparison Table */}
      <div style={styles.comparisonTable}>
        <div style={styles.tableRow}>
          <div style={styles.tableHeader}>Metric</div>
          <div style={{...styles.tableHeader, color: 'var(--accent-green)'}}>Prefill</div>
          <div style={{...styles.tableHeader, color: 'var(--accent-orange)'}}>Decode</div>
        </div>
        <div style={styles.tableRow}>
          <div style={styles.tableCell}>Parallelism</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-green)')}}>All N tokens</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-orange)')}}>1 token</div>
        </div>
        <div style={styles.tableRow}>
          <div style={styles.tableCell}>Bottleneck</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-green)')}}>Compute (FLOPs)</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-orange)')}}>Memory (bandwidth)</div>
        </div>
        <div style={{...styles.tableRow, borderBottom: 'none'}}>
          <div style={styles.tableCell}>KV-Cache</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-green)')}}>Write once</div>
          <div style={{...styles.tableCell, ...styles.highlight('var(--accent-orange)')}}>Read every step</div>
        </div>
      </div>
      <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '1rem', textAlign: 'center'}}>
        Illustrative schematic of the two phases. Any quantities elsewhere in this package are an analytical model, not measured.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<InferencePhasesVisual />);
</script>
</body>
</html>
