<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 4.3 — Latency Waterfall</title>
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
.ev-row { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.75rem 0 0; }
.ev { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.02em; border: 1px solid; background: var(--bg-code); }
.ev-meas { color: var(--accent-green); border-color: rgba(63,185,80,0.45); }
.ev-sim { color: var(--accent-orange); border-color: rgba(210,153,34,0.45); }
.ev-model { color: var(--accent-cyan); border-color: rgba(88,166,255,0.45); }
.ev-lit { color: var(--accent-purple); border-color: rgba(163,113,247,0.45); }
.ev-ill { color: var(--text-secondary); border-color: var(--border-primary); }
</style>
</head>
<body>
<div id="root" role="main"></div>
<script type="text/babel">
function LatencyWaterfall() {
  /* Both waterfalls are retained. Both are component budgets built from vendor
     specifications and protocol behaviour — neither was measured, and no CXL hardware
     exists in this package's evidence base. The ratio between them is NOT claimed. */
  const cxlSteps = [
    { name: 'GPU/host request issue', time: 15, color: 'var(--accent-green)' },
    { name: 'PCIe Gen5 x16 PHY', time: 20, color: 'var(--accent-purple)' },
    { name: 'CXL switch traversal', time: 25, color: 'var(--accent-blue)' },
    { name: 'Endpoint CXL controller decode', time: 40, color: 'var(--accent-blue)' },
    { name: 'DDR5-5600 array access', time: 80, color: 'var(--accent-green)' },
    { name: 'Return path', time: 20, color: 'var(--accent-purple)' }
  ];
  const pcieSteps = [
    { name: 'Driver call + doorbell', time: 4000, color: 'var(--accent-red)' },
    { name: 'DMA descriptor fetch/setup', time: 2500, color: 'var(--accent-red)' },
    { name: 'Software TLB + pinning management', time: 1500, color: 'var(--accent-red)' },
    { name: 'PCIe Gen5 round trip', time: 700, color: 'var(--accent-purple)' },
    { name: 'Host DRAM access', time: 100, color: 'var(--accent-blue)' },
    { name: '4 KiB payload @ 32 GB/s', time: 200, color: 'var(--accent-blue)' },
    { name: 'Completion interrupt + resync', time: 4000, color: 'var(--accent-red)' }
  ];
  const cxlTotal = cxlSteps.reduce((a, b) => a + b.time, 0);   // 200 ns — assumed, unmeasured
  const pcieTotal = pcieSteps.reduce((a, b) => a + b.time, 0); // 13,000 ns = 13.00 us — assumed
  const fmt = (ns) => ns >= 1000 ? (ns / 1000).toFixed(2) + ' µs' : ns + ' ns';
  /* Tier fetch of one 5.00 MiB block (16 tokens x 320 KiB) across the assumed
     32 / 64 / 121 GB/s bandwidth range. This, not a per-access ratio, is the unit
     the argument actually uses. */
  const tierRange = [
    { bw: 32, us: 164, note: 'pessimistic' },
    { bw: 64, us: 82, note: 'mid-range assumption' },
    { bw: 121, us: 43, note: 'CXL 3.0 ×16 theoretical' }
  ];
  /* Step labels are wider than their bars and deliberately overflow onto the card,
     so the bar cannot carry dark text. The fill is dropped to a low-alpha accent
     tint over the dark card with a solid accent rule (drawn as an inset shadow so
     it adds no width), and the label stays light. */
  const tints = {
    'var(--accent-green)': 'rgba(63, 185, 80, 0.22)',
    'var(--accent-purple)': 'rgba(163, 113, 247, 0.22)',
    'var(--accent-blue)': 'rgba(56, 139, 253, 0.22)',
    'var(--accent-red)': 'rgba(248, 81, 73, 0.22)'
  };
  const styles = {
    container: { maxWidth: '900px', margin: '0 auto', padding: '2rem' },
    header: { textAlign: 'center', marginBottom: '1.5rem' },
    lede: { color: 'var(--text-secondary)', fontSize: '0.9rem', lineHeight: 1.7, maxWidth: '72ch', margin: '0.6rem auto 0' },
    grid: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem' },
    card: { background: 'var(--bg-card)', borderRadius: '16px', padding: '1.5rem', border: '2px solid var(--border-primary)' },
    title: (color) => ({ fontSize: '1.05rem', fontWeight: 700, color, marginBottom: '0.3rem', display: 'flex', justifyContent: 'space-between', gap: '0.5rem' }),
    modelled: { fontFamily: 'var(--font-mono)', fontSize: '0.68rem', color: 'var(--accent-cyan)', marginBottom: '0.9rem', letterSpacing: '0.02em' },
    bar: (pct, color) => ({ height: 24, background: tints[color] || color, color: 'var(--text-primary)', boxShadow: `inset 0 0 0 1px ${color}`, borderRadius: 4, marginBottom: 4, width: `${Math.max(pct, 5)}%`, display: 'flex', alignItems: 'center', paddingLeft: 8, fontSize: '0.7rem', whiteSpace: 'nowrap' }),
    compare: { marginTop: '1.5rem', background: 'var(--bg-code)', borderRadius: '12px', padding: '1.5rem', textAlign: 'center' },
    headline: { fontSize: '1.25rem', fontWeight: 700, color: 'var(--accent-orange)', lineHeight: 1.4 },
    body: { color: 'var(--text-secondary)', fontSize: '0.85rem', lineHeight: 1.7 },
    lightStrong: { color: 'var(--text-primary)' },
    tierGrid: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.75rem', marginTop: '1rem' },
    tierCell: { background: 'var(--bg-card)', borderRadius: '10px', padding: '0.9rem 0.6rem', textAlign: 'center' },
    tierVal: { fontFamily: 'var(--font-mono)', fontSize: '1.25rem', fontWeight: 700, color: 'var(--accent-green)' },
    tierLbl: { fontSize: '0.72rem', color: 'var(--text-secondary)', marginTop: '0.25rem', lineHeight: 1.5 }
  };
  return (
    <div style={styles.container}>
      <p className="sr-only">Figure 4.3: a latency waterfall comparing a CXL.mem load/store path against a driver-mediated
      PCIe DMA path for one 4 kibibyte access, each broken into its component steps as proportional bars.
      Both waterfalls are component budgets assembled from vendor specifications and protocol behaviour.
      Neither was measured, and no CXL hardware was measured anywhere in this package, so the ratio between the two
      totals is not claimed and the previously published 65 times headline is retracted. The CXL.mem budget sums to 200
      nanoseconds — 15 nanoseconds request issue, 20 PCIe Gen5 by 16 PHY, 25 switch traversal, 40 endpoint controller
      decode, 80 DDR5-5600 array access and 20 return path — and that 200 nanosecond figure is itself demoted to an
      unmeasured assumption. The PCIe DMA budget sums to 13.00 microseconds — 4.00 microseconds driver call and doorbell,
      2.50 descriptor fetch, 1.50 TLB and pinning, 0.70 PCIe round trip, 0.10 host DRAM access, 0.20 payload transfer and
      4.00 completion interrupt. What the two waterfalls still show, and what does not depend on any ratio, is the shape
      of the difference: most of the PCIe cost is per-access driver and interrupt work that a load/store path never
      performs. The quantity the argument actually uses is not a per-access latency at all but the time to move one whole
      block. Tier latency is an assumption across a 32 to 121 gigabyte per second range, and one 5.00 mebibyte block, which
      is 16 tokens at 320 kibibytes per token, therefore takes 164 microseconds at 32 gigabytes per second, 82 microseconds
      at 64, and 43 microseconds at 121. Against a forward compute of 9 to 18 milliseconds to regenerate the same 16
      tokens, moving the block is two to three orders of magnitude cheaper, and no precise multiple is claimed.</p>
      <div style={styles.header}>
        <div style={{display: 'inline-block', padding: '0.25rem 0.75rem', background: 'rgba(88,166,255,0.12)', color: 'var(--accent-cyan)', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', borderRadius: '20px', marginBottom: '0.5rem'}}>FIGURE 4.3</div>
        <h1 style={{fontSize: '1.5rem', fontWeight: 700}}>Latency Waterfall: two modelled paths</h1>
        <p style={styles.lede}>
          Both budgets below are <strong style={styles.lightStrong}>modelled</strong> — assembled from vendor
          specifications and protocol behaviour. <strong style={styles.lightStrong}>No CXL hardware was measured</strong>,
          so <strong style={styles.lightStrong}>the ratio between them is not claimed</strong>. What survives is the
          shape: most of the PCIe cost is per-access driver and interrupt work a load/store path never performs.
        </p>
        <div className="ev-row">
          <span className="ev ev-model">Analytical model</span>
          <span className="ev ev-ill">Illustrative — component budget, unmeasured</span>
        </div>
      </div>
      <div style={styles.grid}>
        <div style={styles.card}>
          <div style={styles.title('var(--accent-green)')}><span>CXL.mem Path</span><span>{cxlTotal} ns</span></div>
          <div style={styles.modelled}>MODELLED · unmeasured assumption, demoted</div>
          {cxlSteps.map((s, i) => <div key={i} style={styles.bar((s.time / cxlTotal) * 100, s.color)} role="img" aria-label={`${s.name}, ${s.time} nanoseconds of the modelled 200 nanosecond CXL.mem budget`}>{s.name}: {s.time} ns</div>)}
        </div>
        <div style={styles.card}>
          <div style={styles.title('var(--accent-red)')}><span>PCIe DMA Path</span><span>{(pcieTotal/1000).toFixed(2)} µs</span></div>
          <div style={styles.modelled}>MODELLED · unmeasured assumption</div>
          {pcieSteps.map((s, i) => <div key={i} style={styles.bar((s.time / pcieTotal) * 100, s.color)} role="img" aria-label={`${s.name}, ${fmt(s.time)} of the modelled 13.00 microsecond PCIe DMA budget`}>{s.name}: {fmt(s.time)}</div>)}
        </div>
      </div>
      <div style={styles.compare}>
        <div style={styles.headline}>The ratio between these two paths is not claimed</div>
        <div style={{...styles.body, marginTop: '0.6rem'}}>
          The earlier <strong style={styles.lightStrong}>65&times;</strong> headline (13,000 ns &divide; 200 ns) is
          <strong style={styles.lightStrong}> retracted</strong>. It divided a component sum for a hypothetical
          load/store path by a component sum for a driver-mediated DMA path — two different operations, neither of them
          measured. The 200 ns access is demoted to an unmeasured assumption inside a 32–121 GB/s bandwidth range.
        </div>
        <div style={{...styles.body, marginTop: '0.8rem'}}>
          <strong style={styles.lightStrong}>What the argument actually uses is a block, not an access.</strong> One
          block is 16 tokens &times; 320 KiB/token = <strong style={styles.lightStrong}>5.00 MiB</strong>. Across the
          assumed tier-bandwidth range that fetch costs:
        </div>
        <div style={styles.tierGrid}>
          {tierRange.map((t, i) => (
            <div key={i} style={styles.tierCell} role="img" aria-label={`At an assumed ${t.bw} gigabytes per second, ${t.note}, a 5.00 mebibyte block fetch takes ${t.us} microseconds.`}>
              <div style={styles.tierVal}>{t.us} µs</div>
              <div style={styles.tierLbl}>5.00 MiB @ {t.bw} GB/s<br />{t.note}</div>
            </div>
          ))}
        </div>
        <div style={{...styles.body, marginTop: '1rem'}}>
          Set against the <strong style={styles.lightStrong}>9–18 ms</strong> of forward compute needed to regenerate the
          same 16 tokens (50% / 40% / 25% MFU), moving a block is <strong style={styles.lightStrong}>two to three orders
          of magnitude cheaper than regenerating it</strong> — the order of magnitude is the claim, never a precise
          multiple.
          <br /><br />
          Scope of the two waterfalls: same boundary (kernel issue → data available) and the same 4 KiB payload on both
          paths. Component tables sum exactly — 15+20+25+40+80+20 = 200 ns and
          4.00+2.50+1.50+0.70+0.10+0.20+4.00 = 13.00 µs.
          <br /><em>Analytical model — no hardware benchmark was run on either path.</em>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<LatencyWaterfall />);
</script>
</body>
</html>
