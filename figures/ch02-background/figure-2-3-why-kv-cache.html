<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure 2.3 — Why KV-Cache</title>
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>* { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: var(--font-sans); background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }</style>
</head>
<body>
<div id="root" role="main"></div>
<script type="text/babel">
function WhyKVCache() {
  const styles = {
    container: { maxWidth: '900px', margin: '0 auto', padding: '2rem' },
    header: { textAlign: 'center', marginBottom: '2rem' },
    badge: { display: 'inline-block', padding: '0.25rem 0.75rem', background: 'rgba(239,68,68,0.2)', color: 'var(--accent-red)', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', borderRadius: '20px', marginBottom: '0.5rem' },
    grid: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1.5rem' },
    card: (bad) => ({ background: 'var(--bg-card)', borderRadius: '16px', padding: '1.5rem', border: `2px solid ${bad ? 'var(--accent-red)' : 'var(--accent-green)'}` }),
    cardTitle: (bad) => ({ color: bad ? 'var(--accent-red)' : 'var(--accent-green)', fontWeight: 700, fontSize: '1.1rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }),
    step: { background: 'var(--bg-code)', borderRadius: '8px', padding: '0.75rem', marginBottom: '0.5rem', fontSize: '0.875rem' },
    compare: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem', marginTop: '2rem' },
    stat: (bad) => ({ background: 'var(--bg-code)', borderRadius: '12px', padding: '1rem', textAlign: 'center', borderTop: `3px solid ${bad ? 'var(--accent-red)' : 'var(--accent-green)'}` }),
    statVal: (bad) => ({ fontSize: '1.5rem', fontWeight: 700, color: bad ? 'var(--accent-red)' : 'var(--accent-green)' }),
    statLabel: { fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }
  };
  return (
    <div style={styles.container}>
      <p className="sr-only">Figure 2.3: why the KV-cache exists, comparing generation without a cache against generation with one. Without a cache every step recomputes the keys and values for all tokens so far, which is O(N squared) total compute; with a cache each step computes only the new token and appends it, which is O(N). The extra compute avoided grows with context: roughly 1,000× at a 1K context and roughly 131,000× at a 128K context, which is why the context length must always be stated alongside the saving. All values are an analytical model, not measured.</p>
      <div style={styles.header}>
        <div style={styles.badge}>FIGURE 2.3</div>
        <h1 style={{fontSize: '1.75rem', fontWeight: 700, marginBottom: '0.5rem'}}>Why KV-Cache Exists</h1>
        <p style={{color: 'var(--text-secondary)'}}>The cost of NOT caching Key-Value pairs</p>
      </div>
      <div style={styles.grid}>
        <div style={styles.card(true)}>
          <div style={styles.cardTitle(true)}>❌ Without KV-Cache</div>
          <div style={styles.step}>Step 1: Compute K,V for tokens 1..N</div>
          <div style={styles.step}>Step 2: Compute K,V for tokens 1..N+1</div>
          <div style={styles.step}>Step 3: Compute K,V for tokens 1..N+2</div>
          <div style={styles.step}>...</div>
          <div style={{color: 'var(--accent-red)', fontSize: '0.875rem', marginTop: '1rem'}}>O(N²) total compute — recomputing everything each step!</div>
        </div>
        <div style={styles.card(false)}>
          <div style={styles.cardTitle(false)}>✓ With KV-Cache</div>
          <div style={styles.step}>Step 1: Compute K,V for tokens 1..N → <strong>Store</strong></div>
          <div style={styles.step}>Step 2: Compute K,V for token N+1 only → <strong>Append</strong></div>
          <div style={styles.step}>Step 3: Compute K,V for token N+2 only → <strong>Append</strong></div>
          <div style={styles.step}>...</div>
          <div style={{color: 'var(--accent-green)', fontSize: '0.875rem', marginTop: '1rem'}}>O(N) total compute — only new tokens computed!</div>
        </div>
      </div>
      <div style={styles.compare}>
        <div style={styles.stat(true)} role="img" aria-label="FLOPs with no cache: order N squared"><div style={styles.statVal(true)}>N²</div><div style={styles.statLabel}>FLOPs (no cache)</div></div>
        <div style={styles.stat(false)} role="img" aria-label="FLOPs with the cache: order N"><div style={styles.statVal(false)}>N</div><div style={styles.statLabel}>FLOPs (with cache)</div></div>
        <div style={styles.stat(true)} role="img" aria-label="Approximately 1,000× extra compute without the cache, at 1K context"><div style={styles.statVal(true)}>≈1,000×</div><div style={styles.statLabel}>Extra compute without the cache, at 1K context</div></div>
        <div style={styles.stat(true)} role="img" aria-label="Approximately 131,000× extra compute without the cache, at 128K context"><div style={styles.statVal(true)}>≈131,000×</div><div style={styles.statLabel}>Extra compute without the cache, at 128K context</div></div>
      </div>
      <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '1rem', textAlign: 'center'}}>
        Recompute savings scale with context length, so the context must always be stated.
        Analytical model — derived from the attention cost model, not measured.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<WhyKVCache />);
</script>
</body>
</html>
