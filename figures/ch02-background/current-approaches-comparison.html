<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Approaches Comparison</title>
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<link rel="stylesheet" href="../../vendor/fonts.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-primary); min-height: 100vh; color: var(--text-primary); }
.ev-row { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.75rem 0 0; }
.ev { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-family: var(--font-mono);
      font-size: 0.7rem; letter-spacing: 0.02em; border: 1px solid; background: var(--bg-code); }
.ev-meas { color: var(--accent-green); border-color: rgba(63,185,80,0.45); }
.ev-sim { color: var(--accent-orange); border-color: rgba(210,153,34,0.45); }
.ev-model { color: var(--accent-cyan); border-color: rgba(88,166,255,0.45); }
.ev-lit { color: var(--accent-purple); border-color: rgba(163,113,247,0.45); }
.ev-ill { color: var(--text-secondary); border-color: var(--border-primary); }
.tag { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.02em; }
.tag-meas { color: var(--accent-green); }
.tag-model { color: var(--accent-cyan); }
.tag-lit { color: var(--accent-purple); }
</style>
</head>
<body>
<div id="root" role="main"></div>
<script type="text/babel">
function ApproachesComparison() {
  const approaches = [
    { name: 'Quantization', desc: 'Reduce precision (FP16→INT4)', mem: '4×', quality: 'Some loss',
      cost: 'Same step time', evidence: 'External literature', cls: 'tag-lit',
      color: 'var(--accent-purple)', tone: 'neutral' },
    { name: 'Pruning / token dropping', desc: 'Drop less important tokens — a lossy relaxation of residency', mem: '2–4×', quality: 'Significant loss',
      cost: 'Same step time', evidence: 'External literature', cls: 'tag-lit',
      color: 'var(--accent-orange)', tone: 'neutral' },
    { name: 'Host-DRAM offload (PCIe DMA)', desc: 'Swap to system RAM over a driver-mediated DMA path', mem: '∞ capacity', quality: 'None',
      cost: 'Modelled — driver-mediated path, not measured', evidence: 'Analytical model', cls: 'tag-model',
      color: 'var(--accent-red)', tone: 'bad' },
    { name: 'CXL tier (this work)', desc: 'Move whole blocks to a load/store-addressable memory tier', mem: '6×', quality: 'None',
      cost: '43 / 82 / 164 µs per 5.00 MiB block', evidence: 'Analytical model — no CXL hardware measured', cls: 'tag-model',
      color: 'var(--accent-green)', tone: 'good' }
  ];
  const styles = {
    container: { maxWidth: '980px', margin: '0 auto', padding: '2rem' },
    header: { textAlign: 'center', marginBottom: '1.5rem' },
    table: { width: '100%', background: 'var(--bg-card)', borderRadius: '16px', overflow: 'hidden' },
    headerRow: { display: 'grid', gridTemplateColumns: '1.7fr 0.8fr 0.9fr 1.4fr', background: 'var(--bg-code)', padding: '1rem', fontWeight: 600, fontSize: '0.85rem' },
    row: (color) => ({ display: 'grid', gridTemplateColumns: '1.7fr 0.8fr 0.9fr 1.4fr', padding: '1rem', borderTop: '1px solid var(--border-primary)', borderLeft: `3px solid ${color}`, alignItems: 'start' }),
    name: { fontWeight: 600 },
    desc: { fontSize: '0.78rem', color: 'var(--text-secondary)', marginTop: '0.2rem', lineHeight: 1.5 },
    good: { color: 'var(--accent-green)', fontSize: '0.85rem' },
    bad: { color: 'var(--accent-red)', fontSize: '0.85rem' },
    neutral: { color: 'var(--accent-orange)', fontSize: '0.85rem' },
    cost: { fontSize: '0.82rem', color: 'var(--text-primary)', lineHeight: 1.5 },
    panel: { background: 'var(--bg-card)', border: '1px solid var(--border-primary)', borderLeft: '4px solid var(--accent-green)',
             borderRadius: '0 14px 14px 0', padding: '1.15rem 1.25rem', marginTop: '1.5rem' },
    panelTitle: { color: 'var(--accent-green)', fontWeight: 600, fontSize: '0.95rem', marginBottom: '0.5rem' },
    body: { color: 'var(--text-secondary)', fontSize: '0.85rem', lineHeight: 1.7 },
    strongLight: { color: 'var(--text-primary)' },
    caveat: { background: 'var(--bg-card)', border: '1px solid var(--border-primary)', borderLeft: '4px solid var(--accent-orange)',
              borderRadius: '0 14px 14px 0', padding: '1.15rem 1.25rem', marginTop: '1rem' },
    caveatTitle: { color: 'var(--accent-orange)', fontWeight: 600, fontSize: '0.95rem', marginBottom: '0.5rem' },
    mono: { fontFamily: 'var(--font-mono)', color: 'var(--accent-cyan)' }
  };
  const toneStyle = { good: styles.good, bad: styles.bad, neutral: styles.neutral };
  return (
    <div style={styles.container}>
      <p className="sr-only">Figure: comparison of four approaches to the KV-cache memory problem, across memory savings, quality impact and the modelled cost of moving a block. Quantization gives 4 times memory savings with some quality loss and unchanged step time, from external literature. Pruning or token dropping gives 2 to 4 times with significant quality loss and unchanged step time, also from external literature; it is a lossy relaxation of the residency constraint and carries an accuracy-evaluation burden. Host-DRAM offload over a driver-mediated PCIe DMA path gives unbounded capacity with no quality loss, and its cost is modelled, not measured. The CXL tier proposed here gives 6 times capacity with no quality loss; moving one 5.00 mebibyte block, which is 16 tokens at 320 kibibytes per token, takes 43, 82 or 164 microseconds at an assumed tier bandwidth of 121, 64 or 32 gigabytes per second. No CXL hardware was measured, so both offload rows are modelled and no ratio between them is claimed. The previously published 65 times figure, 13.0 microseconds of PCIe DMA against 200 nanoseconds of CXL.mem, and the 177 nanosecond effective latency are retracted. What the tier buys is not a lower access latency but the avoidance of regeneration: moving a block costs 43 to 164 microseconds against a forward compute of 9 to 18 milliseconds for 16 tokens, two to three orders of magnitude, and no precise multiple is claimed. Measured hardware data on a DGX Spark GB10 refutes the single-bandwidth roofline this comparison used to assume: achieved streaming bandwidth is 236.5 gigabytes per second, 87 percent of the 273 gigabyte per second spec, which retires the old 50 percent effective-bandwidth haircut, and decode time is two-term, t equals 100.3 plus 16.34 times KV in gibibytes for HuggingFace with SDPA at R squared 0.991 and t equals 73.9 plus 17.58 times KV in gibibytes for vLLM with FlashAttention-2 at R squared 0.945, giving an inferred fixed-path bandwidth of 151.5 and 205.7 gigabytes per second against an inferred KV-path bandwidth of 65.7 and 61.1. Under that fit the KV path is about 3.4 times more costly per byte, a model-derived ratio rather than a direct byte-level hardware measurement, and kernel substitution alone did not remove the KV slope, which stayed within 8 percent across the two frameworks.</p>
      <div style={styles.header}>
        <div style={{display: 'inline-block', padding: '0.25rem 0.75rem', background: 'rgba(63,185,80,0.12)', color: 'var(--accent-green)', fontSize: '0.75rem', fontFamily: 'var(--font-mono)', borderRadius: '20px', marginBottom: '0.5rem'}}>COMPARISON</div>
        <h1 style={{fontSize: '1.75rem', fontWeight: 700, marginBottom: '0.5rem'}}>Current Approaches</h1>
        <p style={{color: 'var(--text-secondary)', fontSize: '0.9rem', maxWidth: '70ch', margin: '0 auto'}}>
          Capacity, quality and the modelled cost of moving one 5.00 MiB block. <strong style={styles.strongLight}>No CXL
          hardware was measured</strong>, so both offload rows are modelled and no ratio between them is claimed.
        </p>
        <div className="ev-row">
          <span className="ev ev-lit">External literature</span>
          <span className="ev ev-model">Analytical model</span>
          <span className="ev ev-meas">Measured — DGX Spark GB10</span>
        </div>
      </div>
      <div style={styles.table}>
        <div style={styles.headerRow}>
          <div>Approach</div><div>Memory savings</div><div>Quality impact</div><div>Cost to move a block</div>
        </div>
        {approaches.map((a, i) => (
          <div key={i} style={styles.row(a.color)}>
            <div><div style={styles.name}>{a.name}</div><div style={styles.desc}>{a.desc}</div></div>
            <div style={styles.good} role="img" aria-label={`${a.name}, memory savings ${a.mem}`}>{a.mem}</div>
            <div style={a.quality === 'None' ? styles.good : styles.bad} role="img" aria-label={`${a.name}, quality impact ${a.quality}`}>{a.quality}</div>
            <div>
              <div style={styles.cost} role="img" aria-label={`${a.name}, cost to move a block: ${a.cost}. Evidence class: ${a.evidence}.`}>{a.cost}</div>
              <div className={`tag ${a.cls}`} style={{marginTop: '0.3rem'}} aria-hidden="true">{a.evidence}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={styles.panel}>
        <div style={styles.panelTitle}>The measurement refutes the single-bandwidth roofline</div>
        <div style={styles.body}>
          A single-bandwidth roofline charges every byte the same rate. On a DGX Spark (GB10, 19 Aug 2026,
          Qwen2.5-7B fp16) that is not what decode does. Achieved streaming bandwidth is
          <strong style={styles.strongLight}> 236.5 GB/s = 87% of the 273 GB/s spec</strong>, which retires the
          old ~50% "effective bandwidth" haircut. And decode time is <strong style={styles.strongLight}>two-term</strong>,
          not one-term: <span style={styles.mono}>t = 100.3 + 16.34·KV_GiB</span> (HF + SDPA, R² 0.991) and
          <span style={styles.mono}> t = 73.9 + 17.58·KV_GiB</span> (vLLM + FA2, R² 0.945). That gives an inferred
          fixed-path bandwidth of <strong style={styles.strongLight}>151.5 / 205.7 GB/s</strong> against an inferred
          KV-path bandwidth of <strong style={styles.strongLight}>65.7 / 61.1 GB/s</strong> — under that fit the KV
          path is <strong style={styles.strongLight}>~3.4× more costly per byte</strong>, a model-derived ratio, not
          a direct byte-level hardware measurement. Kernel substitution alone did not remove the KV slope: it stayed
          within 8% across two frameworks with different attention implementations and paged vs unpaged layout.
        </div>
      </div>

      <div style={styles.caveat}>
        <div style={styles.caveatTitle}>What the tier actually buys — and what is retracted</div>
        <div style={styles.body}>
          The value of the tier is <strong style={styles.strongLight}>avoiding regeneration</strong>, not a lower
          access latency. Moving a 5.00 MiB block costs <strong style={styles.strongLight}>43–164 µs</strong> across
          the assumed 121 / 64 / 32 GB/s range; regenerating the same 16 tokens by forward compute costs
          <strong style={styles.strongLight}> 9–18 ms</strong> at 50% / 40% / 25% MFU. That is two to three orders of
          magnitude, and <strong style={styles.strongLight}>no precise multiple is claimed</strong> — the two
          quantities do not measure the same operation, and an arbitrary interior block is not independently
          reproducible at all.
          <br /><br />
          <strong style={styles.strongLight}>Retracted from the earlier version of this figure:</strong> the
          65× headline (13.0 µs PCIe DMA ÷ 200 ns CXL.mem) and the 177 ns effective latency. The 200 ns access is
          demoted to an unmeasured assumption inside a 32–121 GB/s range; the 177 ns figure was derived from a 97%
          hit rate that the corrected simulation replaces with a 8.5–91.6% range. 6× capacity stands — it is
          arithmetic over stated capacities, (192 GB HBM + 1,024 GB CXL DRAM) ÷ 192 GB, and never depended on the
          hit rate.
        </div>
      </div>

      <div style={{fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '1rem', textAlign: 'center', lineHeight: 1.7}}>
        Block granularity 16 tokens = 5.00 MiB at 320 KiB/token (Llama-3 70B GQA). Tier fetch 5.00 MiB ÷ 121 / 64 / 32 GB/s
        = 43 / 82 / 164 µs.
        <br />Measured rows: DGX Spark GB10, 19 Aug 2026, scripts/bw_wall.py. Everything about the CXL tier is an
        analytical model — no CXL hardware benchmark was run.
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ApproachesComparison />);
</script>
</body>
</html>
